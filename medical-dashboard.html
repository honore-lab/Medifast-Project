<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Medical Dashboard | MediFast</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="Medifast_Inc._Logo.png">
    <script type="module" src="auth-check.js"></script>
</head>
<body>
    
<nav class="dashboard-nav">
    <a href="index.html" class="logo">
        <img src="Medifast_Inc._Logo.png" alt="MediFast Logo" style="height: 30px;">
    </a>

    
    <div class="nav-links">
        <button id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">🌙</button>
<button id="intakeBtn" class="nav-btn">Intake</button>
<button id="emergencyBtn" class="nav-btn">Emergency</button>
        <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>
</nav>
<br><br><br><br>
  <h1 style="margin-top: 60px;">Medical Staff Dashboard</h1>
    
<div id="emergencySection" style="display: none; border: 2px solid red; padding: 20px;">
    <h2>Emergency Intake Portal</h2>
    <p>Accessing live patient records and emergency tools...</p>

    <table border="1" style="width: 100%; border-collapse: collapse; margin-top: 10px;">
        <thead>
            <tr>
                <th>Full Name</th>
                <th>Status</th>
                <th>Location</th>
                <th>Phone Number</th>
                <th>Action</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="emergencyTableBody">
          
        </tbody>
    </table>
</div>
</div>

<div id="intakeSection" style="display: block;">
    <h2>Patient Intake Requests</h2>
    <table border="1" style="width: 100%; border-collapse: collapse; margin-top: 10px;">
        <thead>
            <tr>
                <th style="padding: 10px; background: #eee;">Name</th>
                <th style="padding: 10px; background: #eee;">Date of Birth</th>
                <th style="padding: 10px; background: #eee;">Reason</th>
                <th style="padding: 10px; background: #eee;">Action</th>
            </tr>
        </thead>
        <tbody id="intakeTableBody">
           
        </tbody>
    </table>
</div>
<!-- Your existing body content and scripts -->
    
    <script>
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const btn = document.getElementById('themeToggleBtn');
            
            if (document.body.classList.contains('dark-mode')) {
                btn.textContent = '☀️';
                localStorage.setItem('theme', 'dark');
            } else {
                btn.textContent = '🌙';
                localStorage.setItem('theme', 'light');
            }
        }

        // This Remember user's theme preference on page load
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
                const btn = document.getElementById('themeToggleBtn');
                if (btn) btn.textContent = '☀️';
            }
        });
    </script>
</body>
</html>
    <script type="module" src="dashboard-logic.js"></script>
</body>
</html>
